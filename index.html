<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Roumaissae Bakkali Benali  (Roumaissae0)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <!-- Shows View -->
    <div id="shows-view">
      <div id="shows-controls">
        <label for="show-search">Search shows:</label>
        <input
          type="search"
          id="show-search"
          placeholder="e.g. comedy"
          aria-label="Search shows by name, summary or genre"
        />
        <p id="show-count" aria-live="polite"></p>
        <label for="show-select">Jump to show:</label>
        <select id="show-select" aria-label="Jump to a specific show"></select>
      </div>
      <div id="shows-listing"></div>
    </div>

    <!-- Episodes View -->
    <div id="episodes-view" hidden>
      <a href="#" id="back-to-shows">&#8592; Back to Shows</a>
      <div id="controls"></div>
      <div id="root"></div>
    </div>

    <!-- Loads YOUR javascript code -->
    <script src="script.js"></script>
  </body>
</html>
